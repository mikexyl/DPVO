# Conservative live settings with bounded storage for the learned multi-robot frontend.
BUFFER_SIZE: 512
PATCHES_PER_FRAME: 64
REMOVAL_WINDOW: 16
OPTIMIZATION_WINDOW: 8
PATCH_LIFETIME: 8
KEYFRAME_INDEX: 4
KEYFRAME_THRESH: 12.5
MOTION_MODEL: DAMPED_LINEAR
MOTION_DAMPING: 0.5
MIXED_PRECISION: True
CENTROID_SEL_STRAT: GRADIENT_BIAS
LOOP_CLOSURE: False
CLASSIC_LOOP_CLOSURE: True
CLASSIC_PGO_USE_THREADS: True
