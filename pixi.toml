[workspace]
name = "dpvo"
version = "0.1.0"
description = "Local CUDA environment for DPVO training and inference"
channels = ["pyg", "pytorch", "nvidia", "conda-forge"]
platforms = [
  { name = "linux-64-cuda121", platform = "linux-64", cuda = "12.1", glibc = "2.31" },
]
requires-pixi = ">=0.76"

[dependencies]
python = "3.10.*"
pip = "*"
setuptools = "*"
wheel = "*"
ninja = "*"
cmake = "3.29.*"
pkg-config = "*"
gcc_linux-64 = "11.4.*"
gxx_linux-64 = "11.4.*"
cuda-nvcc = "12.1.*"
cuda-cudart-dev = "12.1.*"
cuda-cudart-static = "12.1.*"
cuda-libraries-dev = "12.1.*"
cuda-version = "12.1.*"
cuda-cccl = "12.1.*"
eigen = "3.4.*"
glew = "*"
libgl-devel = "*"
libegl-devel = "*"
libglvnd-devel = "*"
libopengl-devel = "*"
xorg-libx11 = "*"
xorg-libxext = "*"
xorg-libxi = "*"
numpy = "1.26.4.*"
pytorch = "2.3.1.*"
torchvision = "0.18.*"
pytorch-cuda = "12.1.*"
pytorch-scatter = "2.1.2.*"

[pypi-dependencies]
tensorboard = "*"
numba = "*"
tqdm = "*"
einops = "*"
pypose = "*"
kornia = "*"
plyfile = "*"
evo = "*"
opencv-python = "*"
yacs = "*"
matplotlib = "*"
rerun-sdk = "==0.23.1"
huggingface-hub = "*"
safetensors = "*"

[activation.env]
PYTHONNOUSERSITE = "1"
MPLBACKEND = "Agg"
TORCH_CUDA_ARCH_LIST = "8.9"
MAX_JOBS = "6"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[tasks]
build = { cmd = "python -m pip install --no-build-isolation -e ." }
verify = { cmd = "python -c \"import torch, cuda_ba, cuda_corr, lietorch_backends; print('torch', torch.__version__, 'cuda', torch.version.cuda, 'available', torch.cuda.is_available()); print('DPVO extensions: OK')\"", depends-on = ["build"] }
configure-pangolin = { cmd = "cmake -S Pangolin -B Pangolin/build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF -DBUILD_PANGOLIN_PYTHON=OFF" }
build-pangolin = { cmd = "cmake --build Pangolin/build --parallel 6", depends-on = ["configure-pangolin"] }
build-viewer = { cmd = "CMAKE_ARGS=\"-DCMAKE_PREFIX_PATH=$PIXI_PROJECT_ROOT/Pangolin/build\" python -m pip install --no-build-isolation -e ./DPViewer", depends-on = ["build-pangolin"] }
configure-dbow2 = { cmd = "cmake -S DBoW2 -B build/dbow2 -DCMAKE_BUILD_TYPE=Release -DBUILD_Demo=OFF -DOpenCV_DIR=/usr/lib/x86_64-linux-gnu/cmake/opencv4 -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX" }
build-dbow2 = { cmd = "cmake --build build/dbow2 --parallel 6", depends-on = ["configure-dbow2"] }
install-dbow2 = { cmd = "cmake --install build/dbow2", depends-on = ["build-dbow2"] }
build-retrieval = { cmd = "CMAKE_ARGS=\"-DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DOpenCV_DIR=/usr/lib/x86_64-linux-gnu/cmake/opencv4\" python -m pip install --no-build-isolation -e ./DPRetrieval", depends-on = ["install-dbow2"] }
verify-classic = { cmd = "python -c \"import dpretrieval; print('DPRetrieval', dpretrieval.__version__, 'OK')\"", depends-on = ["build-retrieval"] }
install-teaser = { cmd = "python -m pip install --no-deps 'git+https://github.com/MIT-SPARK/TEASER-plusplus.git@52a9c52ee7d4c838c5e8a75458c33178be5bfb70'" }
verify-teaser = { cmd = "python -c \"import teaserpp_python; print('TEASER++ Python: OK')\"", depends-on = ["install-teaser"] }
verify-multi-robot = { cmd = "python -m unittest tests.test_distributed_loop_closure tests.test_learned_loop_frontend tests.test_centralized_pgo -v", depends-on = ["verify-classic", "verify-teaser"] }
